; Plataforma: ESP32 DevKit V1 (30 pines) - WROOM (confirmar, ver especificación 5)
; Framework: Arduino
; Versiones de librerías FIJAS (regla del proyecto: no cambiar sin decirlo)

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Partición sin OTA (app ~3 MB, +2 MB de holgura). NVS queda en el mismo
; offset (0x9000) que default.csv → no requiere erase del chip.
board_build.partitions = no_ota.csv

lib_ldf_mode = chain+

lib_deps =
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/DHT sensor library@1.4.7
    olikraus/U8g2@2.36.18
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/OneWire@2.3.8
    adafruit/RTClib@2.1.4
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Wire/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
